name: Build & Publish Desktop Release (.exe)

on:
  push:
    tags:
      - '[vV]*'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-windows:
    name: Build Windows NSIS Setup & Portable .exe
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Install npm dependencies
        run: npm ci

      - name: Run quality & security checks
        run: |
          npm run typecheck
          npm run lint
          npm test

      - name: Build Tauri Windows Desktop .exe & NSIS Installer
        run: npx tauri build

      - name: Upload Windows .exe & NSIS Setup to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/Pulse.exe
