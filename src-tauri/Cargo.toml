[package]
name = "pulse-desktop"
version = "0.1.0"
description = "Pulse — Open-Source BYO-Client-ID Spotify Client (Desktop Shell)"
authors = ["Pulse Contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "pulse_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
keyring = { version = "3.6", features = ["apple-native", "windows-native", "sync-secret-service"] }
tiny_http = "0.12"
url = "2.5"
open = "5"
